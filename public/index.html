<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171d35">
    <meta
      name="description"
      content="Step into the world of your book and decide how the adventure unfolds."
    >
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/world-rules.css">
    <link rel="stylesheet" href="/narrative-layout.css">
    <title>BookRPG - Enter your story</title>
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main id="app" class="app-shell" tabindex="-1">
      <section class="boot-screen" aria-label="BookRPG is loading">
        <div class="boot-mark" aria-hidden="true">
          <span>B</span>
        </div>
        <p class="boot-wordmark">BOOKRPG</p>
        <p class="boot-copy">Opening your library...</p>
      </section>
    </main>

    <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite" hidden>
      <div class="loading-card">
        <div class="page-loader" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <p id="loading-label">Just a moment...</p>
        <span>Your progress is safely stored.</span>
      </div>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="false"></div>
    <script src="/world-rules.js"></script>
    <script src="/narrative-layout.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
